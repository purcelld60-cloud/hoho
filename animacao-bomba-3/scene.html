<!doctype html><html><head><meta charset="utf-8">

<canvas id="out" width="720" height="1280"></canvas>
<script src="three.min.js"></script>
<script>
"use strict";
/* Vídeo 3 — o vídeo original continua passando; por cima entram inserções (b-roll):
   cortes 3D da casa e cartões com as fotos das bombas, sincronizados com a fala. */
const W=720,H=1280;
const out=document.getElementById("out"),ctx=out.getContext("2d");
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const sm=x=>{x=clamp(x);return x*x*(3-2*x);};
const ramp=(t,a,b)=>sm((t-a)/(b-a));
const win=(t,a,b,f=.3)=>Math.min(ramp(t,a,a+f),1-ramp(t,b-f,b));
const back=x=>{x=clamp(x);const c=1.70158;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);};
function rr(x,X,Y,w,h,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath();}

/* ================= 3D: casa com caixa d'água baixa ================= */
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(1);renderer.setSize(W,H);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();scene.background=new THREE.Color("#cfe6f5");scene.fog=new THREE.Fog("#cfe6f5",40,90);
const camera=new THREE.PerspectiveCamera(48,W/H,.05,200);
scene.add(new THREE.HemisphereLight(0xffffff,0x8a7a62,.85));
const sun=new THREE.DirectionalLight(0xfff4e2,.85);sun.position.set(-6,14,12);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-10,right:10,top:10,bottom:-4,far:50});scene.add(sun);
const M=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.75},o));
function mesh(g,m,x=0,y=0,z=0,par=scene){const o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;par.add(o);return o;}

mesh(new THREE.BoxGeometry(40,2,14),M("#6fae54"),0,-1,0);
const wallM=M("#f2e6d0"),slab=M("#cfc6b6");
mesh(new THREE.BoxGeometry(7.6,3,.2),wallM,0,1.5,-1.6);
mesh(new THREE.BoxGeometry(.2,3,3.4),wallM,-3.8,1.5,0);mesh(new THREE.BoxGeometry(.2,3,3.4),wallM,3.8,1.5,0);
mesh(new THREE.BoxGeometry(.12,3,2.2),wallM,-.55,1.5,-.55);
mesh(new THREE.BoxGeometry(7.9,.18,3.6),slab,0,3.07,0);
mesh(new THREE.BoxGeometry(7.4,.08,3.2),M("#b88a5a"),0,.04,0);
mesh(new THREE.BoxGeometry(3.1,.07,3.1),M("#dbe7ef"),-2.2,.09,0);
// shower (bathroom, left)
mesh(new THREE.CylinderGeometry(.05,.05,.5,8),M("#b0b7bf",{metalness:.6,roughness:.3}),-2.2,2.66,-1.25);
mesh(new THREE.CylinderGeometry(.26,.13,.12,16),M("#b0b7bf",{metalness:.6,roughness:.3}),-2.2,2.4,-1.15);
mesh(new THREE.BoxGeometry(1.5,.1,1.4),M("#e8f1f6"),-2.2,.15,-.8);
const showerDrops=[];for(let i=0;i<70;i++)showerDrops.push(mesh(new THREE.SphereGeometry(.045,6,4),M("#3b9be0",{emissive:"#16588f"})));
// kitchen sink (right)
mesh(new THREE.BoxGeometry(2.2,.9,.9),M("#d6d3d1"),2.6,.45,-1.1);
mesh(new THREE.BoxGeometry(.8,.08,.55),M("#9ca3af"),2.6,.92,-1.05);
const tapPipe=mesh(new THREE.CylinderGeometry(.04,.04,.4,8),M("#b0b7bf",{metalness:.6}),2.6,1.2,-1.38);
mesh(new THREE.BoxGeometry(.06,.06,.3),M("#b0b7bf",{metalness:.6}),2.6,1.38,-1.25);
const tapDrops=[];for(let i=0;i<30;i++)tapDrops.push(mesh(new THREE.SphereGeometry(.035,6,4),M("#3b9be0",{emissive:"#16588f"})));
mesh(new THREE.CylinderGeometry(.2,.16,.35,10),M("#b45309"),3.35,1.08,-1.2);mesh(new THREE.IcosahedronGeometry(.32,0),M("#3f8f3a"),3.35,1.45,-1.2);
mesh(new THREE.BoxGeometry(.05,.9,1.1),M("#a8d4f0",{roughness:.1}),3.92,1.8,0);
// water tank, barely above the roof
const tank=new THREE.Group();tank.position.set(.3,3.16,-.9);scene.add(tank);
mesh(new THREE.CylinderGeometry(.8,.74,1.15,26,1,true),M("#3c7fc4",{transparent:true,opacity:.3,side:THREE.DoubleSide,depthWrite:false}),0,.58,0,tank).castShadow=false;
mesh(new THREE.CylinderGeometry(.84,.84,.08,26),M("#2d5f94"),0,1.18,0,tank);
mesh(new THREE.CylinderGeometry(.74,.74,.04,26),M("#2d5f94"),0,.02,0,tank);
mesh(new THREE.CylinderGeometry(.72,.7,.85,26),M("#2f8fe0",{transparent:true,opacity:.85,emissive:"#0b3d6b"}),0,.45,0,tank);
// pipes
const P=(x,y,z=-1.25)=>new THREE.Vector3(x,y,z);
const pipeM=M("#9fb8c8",{transparent:true,opacity:.35,roughness:.15,depthWrite:false});
function makePath(pts){const cp=new THREE.CurvePath();for(let i=0;i<pts.length-1;i++){cp.add(new THREE.LineCurve3(pts[i],pts[i+1]));
  const a=pts[i],b=pts[i+1],c=mesh(new THREE.CylinderGeometry(.09,.09,a.distanceTo(b),12,1,true),pipeM);c.castShadow=false;c.position.copy(a).add(b).multiplyScalar(.5);
  c.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),b.clone().sub(a).normalize());}return cp;}
const pathA=makePath([P(.3,3.25,-.9),P(.3,2.78,-.9),P(.3,2.78),P(-2.2,2.78),P(-2.2,2.5,-1.2)]);
const pathB=makePath([P(.3,3.25,-.9),P(.3,2.78,-.9),P(.3,2.78),P(2.6,2.78),P(2.6,1.4)]);
[P(.3,2.78,-.9),P(.3,2.78),P(-2.2,2.78),P(2.6,2.78)].forEach(p=>mesh(new THREE.SphereGeometry(.11,10,8),M("#8ea4b3"),p.x,p.y,p.z));
const NA=60,NB=60;
const dropM=M("#1f8ff0",{emissive:"#0b4f8f",roughness:.2});
const dropsA=new THREE.InstancedMesh(new THREE.SphereGeometry(.07,8,6),dropM,NA),dropsB=new THREE.InstancedMesh(new THREE.SphereGeometry(.07,8,6),dropM,NB);
scene.add(dropsA,dropsB);const dummy=new THREE.Object3D();
// height arrow ("pouca altura")
const arrow=new THREE.Group();arrow.position.set(-.85,0,-.6);scene.add(arrow);
const aM=new THREE.MeshBasicMaterial({color:"#dc2626"});
const aShaft=mesh(new THREE.CylinderGeometry(.035,.035,1,8),aM,0,0,0,arrow);
const aTop=mesh(new THREE.ConeGeometry(.12,.25,12),aM,0,0,0,arrow),aBot=mesh(new THREE.ConeGeometry(.12,.25,12),aM,0,0,0,arrow);aBot.rotation.z=Math.PI;
const dash1=mesh(new THREE.BoxGeometry(1.3,.025,.025),aM,.55,2.4,0,arrow),dash2=mesh(new THREE.BoxGeometry(1.3,.025,.025),aM,.55,4.0,0,arrow);
// pumps (my own simple models)
function whitePump(){const g=new THREE.Group();scene.add(g);
  mesh(new THREE.BoxGeometry(.42,.6,.38),M("#f5f3ea",{roughness:.4}),0,0,0,g);
  mesh(new THREE.BoxGeometry(.44,.1,.4),M("#2b2f36"),0,.33,0,g);
  mesh(new THREE.CylinderGeometry(.06,.06,.02,14),M("#0ea5e9",{emissive:"#075985"}),0,-.08,.2,g).rotation.x=Math.PI/2;
  const led=mesh(new THREE.SphereGeometry(.03,8,6),M("#22c55e",{emissive:"#22c55e"}),.12,.12,.2,g);g.userData.led=led;return g;}
const ptShower=whitePump();ptShower.position.set(-1.45,2.5,-1.22);
const ptTap=whitePump();ptTap.position.set(2.6,2.1,-1.22);
const house=new THREE.Group();scene.add(house);house.position.set(1.25,2.42,-1.2);
mesh(new THREE.BoxGeometry(.4,.4,.42),M("#e4572e",{roughness:.35}),-.2,0,0,house);
mesh(new THREE.CylinderGeometry(.18,.18,.45,16),M("#e4572e",{roughness:.35}),-.2,.32,0,house);
mesh(new THREE.CylinderGeometry(.2,.2,.5,18),M("#1f2933",{roughness:.4}),.25,0,0,house).rotation.z=Math.PI/2;
mesh(new THREE.BoxGeometry(.3,.34,.2),M("#22272e"),.25,.02,.24,house);
const houseLed=mesh(new THREE.SphereGeometry(.03,8,6),M("#22c55e",{emissive:"#22c55e"}),.33,.12,.35,house);
// person in the shower
function person({skin,shirt,pants,hair,towel=false,s=1}){const root=new THREE.Group(),body=new THREE.Group();root.add(body);
  const Sk=M(skin),Sh=M(towel?skin:shirt),Pa=M(towel?"#7dd3fc":pants),Ha=M(hair);
  const leg=x=>{const g=new THREE.Group();g.position.set(x,.9,0);mesh(new THREE.BoxGeometry(.26,.9,.28),towel?Sk:Pa,0,-.45,0,g);body.add(g);return g;};
  const legL=leg(-.16),legR=leg(.16);mesh(new THREE.BoxGeometry(.72,.9,.42),Sh,0,1.35,0,body);if(towel)mesh(new THREE.BoxGeometry(.78,.5,.48),Pa,0,.85,0,body);
  const head=new THREE.Group();head.position.y=1.82;body.add(head);mesh(new THREE.SphereGeometry(.32,16,12),Sk,0,.28,0,head);
  mesh(new THREE.SphereGeometry(.335,16,10,0,Math.PI*2,0,Math.PI/2.2),Ha,0,.32,-.02,head);
  const eM=M("#111");mesh(new THREE.SphereGeometry(.045,8,6),eM,-.11,.33,.29,head);mesh(new THREE.SphereGeometry(.045,8,6),eM,.11,.33,.29,head);
  const mouth=mesh(new THREE.TorusGeometry(.085,.02,6,12,Math.PI),M("#7a2a2a"),0,.18,.3,head);
  const arm=x=>{const g=new THREE.Group();g.position.set(x,1.72,0);mesh(new THREE.BoxGeometry(.2,.75,.22),Sh,0,-.36,0,g);mesh(new THREE.SphereGeometry(.11,8,6),Sk,0,-.78,0,g);body.add(g);return g;};
  const armL=arm(-.47),armR=arm(.47);root.scale.setScalar(s);scene.add(root);return {root,head,mouth,legL,legR,armL,armR};}
function pose(p,{la=[0,0],ra=[0,0],ht=0,hy=0,smile=true}){p.armL.rotation.set(la[0],0,la[1]);p.armR.rotation.set(ra[0],0,ra[1]);p.head.rotation.set(ht,hy,0);p.mouth.rotation.z=smile?Math.PI:0;p.mouth.position.y=smile?.2:.14;}
const morador=person({skin:"#d9a066",hair:"#2b1b10",towel:true,s:.8});morador.root.position.set(-2.2,.14,-.85);
const moradora=person({skin:"#8d5524",shirt:"#ec4899",pants:"#1f2937",hair:"#1b1110",s:.8});moradora.root.position.set(2.0,.1,-.25);moradora.root.rotation.y=-.5;
// 3D labels
function label(text,{bg="#fff",fg="#0f172a",icon=""}={}){const c=document.createElement("canvas"),x=c.getContext("2d");x.font="800 46px Inter";
  const tw=x.measureText(text).width+(icon?64:0);c.width=Math.ceil(tw+56);c.height=88;x.fillStyle="rgba(0,0,0,.25)";rr(x,4,8,c.width-8,c.height-12,24);x.fill();
  x.fillStyle=bg;rr(x,2,2,c.width-8,c.height-12,24);x.fill();let X=26;
  if(icon){x.fillStyle=fg;x.beginPath();x.arc(X+22,40,24,0,7);x.fill();x.fillStyle=bg;x.font="900 34px Inter";x.textAlign="center";x.fillText(icon,X+22,52);x.textAlign="left";X+=64;}
  x.font="800 46px Inter";x.fillStyle=fg;x.fillText(text,X,58);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthTest:false}));s.renderOrder=10;s.userData.aspect=c.width/c.height;scene.add(s);return s;}
const OK={bg:"#16a34a",fg:"#fff"},BAD={bg:"#dc2626",fg:"#fff"},INFO={bg:"#fff",fg:"#0f172a"};
const LABELS=[
  ["Caixa d'água baixa",INFO,"",[.3,4.75,-.9],2.7,5.0,.42],
  ["Pouca altura",BAD,"!",[-.3,3.2,0],3.3,5.0,.36],
  ["Chuveiro fraco",BAD,"✕",[-2.2,2.95,-.4],5.1,6.3,.2],
  ["Torneira fraca",BAD,"✕",[2.6,2.0,-.4],6.4,7.5,.2],
  ["Pressurizador de 1 ponto",OK,"✓",[-1.6,3.05,-.4],21.4,24.9,.18],
  ["Ou só na torneira",OK,"✓",[2.4,2.85,-.4],25.0,25.85,.2],
  ["Pressuriza a casa toda",OK,"✓",[.6,4.75,-.4],26.0,27.7,.42],
].map(([t,st,ic,p,a,b,sc])=>{const s=label(t,{...st,icon:ic});s.position.set(...p);return {s,a,b,sc};});
// camera shots inside the 3D cutaways
const SHOTS=[[2.4,[0,2.6,15.5],[0,2.4,-.5]],[4.6,[0,2.6,14.2],[0,2.4,-.5]],[5.2,[-2.0,1.7,5.6],[-2.0,1.6,-1]],[6.1,[-2.0,1.7,5.4],[-2.0,1.6,-1]],[6.6,[2.4,1.5,5.4],[2.4,1.3,-1]],[7.6,[2.4,1.5,5.2],[2.4,1.3,-1]],
 [20.8,[-1.8,2.0,6.4],[-1.8,1.8,-1]],[24.6,[-1.8,2.0,5.8],[-1.8,1.8,-1]],[25.1,[2.3,1.9,5.8],[2.4,1.8,-1]],[25.7,[2.3,1.9,5.7],[2.4,1.8,-1]],[26.3,[0,2.6,15.5],[0,2.4,-.5]],[28,[0,2.6,14.8],[0,2.4,-.5]]];
function camAt(t){let i=0;while(i<SHOTS.length-2&&t>SHOTS[i+1][0])i++;const a=SHOTS[i],b=SHOTS[i+1];const k=sm((t-a[0])/(b[0]-a[0]));const lp=(u,v)=>u.map((x,j)=>x+(v[j]-x)*k);return [lp(a[1],b[1]),lp(a[2],b[2])];}
// states
const ptS=t=>ramp(t,21.2,21.7)*(1-ramp(t,25.8,26.2)), ptT=t=>ramp(t,25.0,25.4)*(1-ramp(t,25.8,26.2)), wh=t=>ramp(t,25.9,26.4);
const strongA=t=>Math.max(ramp(t,21.6,22.2)*(1-ramp(t,25.8,26.0)),ramp(t,26.2,26.6)), strongB=t=>Math.max(ramp(t,25.3,25.6)*(1-ramp(t,25.8,26.0)),ramp(t,26.2,26.6));
const DT=1/120;const phA=[0],phB=[0];for(let i=1;i<=40/DT;i++){const t=i*DT;phA.push(phA[i-1]+(.5+3.5*strongA(t))*DT);phB.push(phB[i-1]+(.5+3.5*strongB(t))*DT);}
const lk=(a,t)=>a[Math.min(a.length-1,Math.round(t/DT))];
function flow(inst,path,n,ph,str){const L=path.getLength();for(let i=0;i<n;i++){const s=((i/n)*L+ph)%L;const vis=str>.5||i%3===0;
  dummy.position.copy(path.getPointAt(s/L));dummy.scale.setScalar(vis?.9:0);dummy.updateMatrix();inst.setMatrixAt(i,dummy.matrix);}inst.instanceMatrix.needsUpdate=true;}
function draw3D(t){
  const [cp,ct]=camAt(t);camera.position.set(...cp);camera.lookAt(...ct);
  const sA=strongA(t),sB=strongB(t);
  flow(dropsA,pathA,NA,lk(phA,t),sA);flow(dropsB,pathB,NB,lk(phB,t),sB);
  showerDrops.forEach((d,i)=>{const u=((t*(1.2+sA)+i/showerDrops.length)%1);const fr=.1+.9*sA;d.visible=i/showerDrops.length<fr;
    const sp=.08+.32*sA;d.position.set(-2.2+Math.sin(i*2.4)*sp*u,2.32-u*2.15,-1.15+Math.cos(i*1.7)*sp*u+.25*u*sA);});
  tapDrops.forEach((d,i)=>{const u=((t*(1.4+2*sB)+i/tapDrops.length)%1);const fr=.12+.88*sB;d.visible=i/tapDrops.length<fr;d.position.set(2.6,1.36-u*.42,-1.1+.02*Math.sin(i));});
  // height arrow between shower head and tank water level
  const ar=win(t,3.1,5.1,.3);arrow.visible=ar>.01;const y0=2.4,y1=y0+(4.0-y0)*ramp(t,3.1,3.6);
  aShaft.scale.y=Math.max(.01,y1-y0-.3);aShaft.position.y=(y0+y1)/2;aTop.position.y=y1-.12;aBot.position.y=y0+.12;dash2.position.y=y1;
  // pumps
  ptShower.scale.setScalar(Math.max(.001,back(ptS(t))));ptTap.scale.setScalar(Math.max(.001,back(ptT(t))));house.scale.setScalar(Math.max(.001,back(wh(t))));
  [ptShower,ptTap].forEach(p=>p.userData.led.material.emissive.set(Math.sin(t*8)>0?"#22c55e":"#14532d"));
  houseLed.material.emissive.set(Math.sin(t*8)>0?"#22c55e":"#14532d");
  [ptShower,ptTap,house].forEach(p=>{p.position.x+=0;});
  // people
  if(sA<.5)pose(morador,{la:[-.5,.5],ra:[-.5,-.5],ht:.35,hy:Math.sin(t*6)*.25*win(t,5,6.3),smile:false});
  else{const w=Math.sin(t*10)*.35;pose(morador,{la:[0,2.6+w],ra:[0,-2.6-w],ht:-.15});}
  morador.root.position.y=.14+(sA>.5?Math.abs(Math.sin(t*6.5))*.2:0);
  pose(moradora,sB>.5?{la:[-.6,.2],ra:[-2.8,-.3+Math.sin(t*10)*.4]}:{la:[0,.6],ra:[0,-.6],ht:.25,smile:false});
  LABELS.forEach(({s,a,b,sc})=>{const o=win(t,a,b,.25);s.visible=o>.01;s.material.opacity=o;const pop=1+.12*(1-ramp(t,a,a+.3));s.scale.set(sc*s.userData.aspect*pop,sc*pop,1);});
  renderer.render(scene,camera);
}

/* ================= 2D overlays ================= */
const imgs={};
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src;});}
async function preload(){for(const n of ["branca","vermelha","preta"])imgs[n]=await loadImg("img/"+n+".jpg");}
function chip(text,cx,cy,{bg="#fff",fg="#0f172a",size=40,alpha=1,scale=1}={}){if(alpha<=0)return;ctx.save();ctx.globalAlpha=alpha;ctx.translate(cx,cy);ctx.scale(scale,scale);
  ctx.font="800 "+size+"px Inter";const w=ctx.measureText(text).width+size*1.1,h=size*1.7;
  ctx.shadowColor="rgba(0,0,0,.35)";ctx.shadowBlur=18;ctx.shadowOffsetY=6;ctx.fillStyle=bg;rr(ctx,-w/2,-h/2,w,h,h/2);ctx.fill();ctx.shadowColor="transparent";
  ctx.fillStyle=fg;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(text,0,2);ctx.restore();}
function card(img,cx,cy,w,h,{rot=0,alpha=1,scale=1,tag=null,tagBg="#16a34a"}={}){if(alpha<=0)return;ctx.save();ctx.globalAlpha=alpha;ctx.translate(cx,cy);ctx.rotate(rot);ctx.scale(scale,scale);
  ctx.shadowColor="rgba(0,0,0,.45)";ctx.shadowBlur=30;ctx.shadowOffsetY=12;ctx.fillStyle="#fff";rr(ctx,-w/2-10,-h/2-10,w+20,h+20,26);ctx.fill();ctx.shadowColor="transparent";
  ctx.save();rr(ctx,-w/2,-h/2,w,h,18);ctx.clip();const ir=img.width/img.height,br=w/h;let sw=img.width,sh=img.height,sx=0,sy=0;
  if(ir>br){sw=img.height*br;sx=(img.width-sw)/2;}else{sh=img.width/br;sy=(img.height-sh)/2;}ctx.drawImage(img,sx,sy,sw,sh,-w/2,-h/2,w,h);ctx.restore();
  if(tag){ctx.font="800 30px Inter";const tw=ctx.measureText(tag).width+36;ctx.fillStyle=tagBg;rr(ctx,-tw/2,h/2-8,tw,52,26);ctx.fill();ctx.fillStyle="#fff";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(tag,0,h/2+19);}
  ctx.restore();}
function pop(t,a,b){const o=win(t,a,b,.25);return {alpha:o,scale:.6+.4*back(ramp(t,a,a+.45))-.08*ramp(t,b-.25,b)};}

async function renderAt(t,i){
  const frame=await loadImg("src/"+String(i+1).padStart(5,"0")+".jpg");
  ctx.globalAlpha=1;ctx.drawImage(frame,0,0,W,H);
  // full-screen 3D cutaways (b-roll) with a quick wipe
  const cut=Math.max(win(t,2.45,7.45,.3),win(t,20.95,27.7,.3));
  if(cut>0){draw3D(t);ctx.save();ctx.globalAlpha=1;const r=Math.hypot(W,H)*cut;ctx.beginPath();ctx.arc(W/2,H/2,r/1.0,0,7);ctx.clip();ctx.drawImage(renderer.domElement,0,0);ctx.restore();}
  // chips over the speaker
  {let p=pop(t,.5,2.4);chip("Pergunta frequente",W/2,150,{bg:"#0f172a",fg:"#7dd3fc",size:38,...p});}
  {let p=pop(t,7.6,9.0);chip("Qual a solução?",W/2,170,{size:44,...p});}
  {let p=pop(t,9.0,11.4);chip("A solução:",W/2,170,{bg:"#16a34a",fg:"#fff",size:44,...p});}
  // product cards
  {const a=pop(t,11.5,14.0);if(a.alpha>0){chip("Bomba pressurizadora",W/2,150,{bg:"#0f172a",fg:"#fff",size:40,alpha:a.alpha});
    const k=ramp(t,11.5,12.4);
    card(imgs.vermelha,W/2-185*k,560,250,330,{rot:-.12*k,alpha:a.alpha,scale:a.scale});
    card(imgs.preta,W/2+185*k,560,250,330,{rot:.12*k,alpha:a.alpha,scale:a.scale});
