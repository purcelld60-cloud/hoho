<script>
"use strict";
const W=720,H=1280;
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(1);renderer.setSize(W,H);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const out=document.getElementById("out"),ctx=out.getContext("2d");
const scene=new THREE.Scene();
scene.background=new THREE.Color("#cfe6f5");
scene.fog=new THREE.Fog("#cfe6f5",40,90);
const camera=new THREE.PerspectiveCamera(48,W/H,.1,200);
scene.add(new THREE.HemisphereLight(0xffffff,0x8a7a62,.85));

sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-14,right:14,top:14,bottom:-6,far:60});scene.add(sun);

const M=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.75},o));
function mesh(g,m,x=0,y=0,z=0,par=scene){const o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;par.add(o);return o;}
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const sm=x=>{x=clamp(x);return x*x*(3-2*x);};
const ramp=(t,a,b)=>sm((t-a)/(b-a));
const win=(t,a,b,f=.4)=>Math.min(ramp(t,a,a+f),1-ramp(t,b-f,b));

/* ---------- ground: street + soil cutaway ---------- */
mesh(new THREE.BoxGeometry(40,3,6),M("#9b7653"),0,-1.5,-1.4);           // soil block, front face z=1.6
mesh(new THREE.BoxGeometry(40,.12,6),M("#6fae54"),6,.0,-1.4);            // grass (right side)
const street=mesh(new THREE.BoxGeometry(11,.14,6),M("#5b6068"),-6.5,.01,-1.4);
for(let x=-11;x<-1.5;x+=1.6)mesh(new THREE.BoxGeometry(.8,.02,.12),M("#f3f3f3"),x,.09,-1.4);
mesh(new THREE.BoxGeometry(2.2,.3,6),M("#b9bcc2"),-0.2,.12,-1.4);        // sidewalk
for(let i=0;i<14;i++)mesh(new THREE.BoxGeometry(.3+Math.random()*.4,.12,.05),M("#7d5c3e"),-10+Math.random()*20,-.6-Math.random()*2.2,1.62);

/* ---------- house (cutaway) ---------- */
const house=new THREE.Group();scene.add(house);
const wallM=M("#f2e6d0"),inner=M("#e9dcc4"),slab=M("#cfc6b6");
mesh(new THREE.BoxGeometry(5.6,7.2,.25),wallM,4.4,3.6,-1.6,house);   // back wall
mesh(new THREE.BoxGeometry(.25,7.2,3.4),wallM,1.7,3.6,0,house);       // left wall
mesh(new THREE.BoxGeometry(.25,7.2,3.4),wallM,7.1,3.6,0,house);       // right wall
mesh(new THREE.BoxGeometry(5.6,.25,3.4),slab,4.4,3.6,0,house);        // 1st floor slab
mesh(new THREE.BoxGeometry(5.9,.3,3.6),slab,4.4,7.25,0,house);        // roof slab
mesh(new THREE.BoxGeometry(5.6,.12,3.4),M("#b88a5a"),4.4,.1,0,house); // floor
// furniture: sofa, table, bed, shower
mesh(new THREE.BoxGeometry(1.8,.5,.8),M("#3d6fa8"),3.4,.45,-1,house);mesh(new THREE.BoxGeometry(1.8,.6,.2),M("#3d6fa8"),3.4,.85,-1.35,house);
mesh(new THREE.BoxGeometry(1,.08,.7),M("#8a5a35"),5.6,.8,-.6,house);mesh(new THREE.BoxGeometry(.08,.7,.08),M("#8a5a35"),5.6,.45,-.6,house);
mesh(new THREE.BoxGeometry(1.8,.4,1.2),M("#f7f7f7"),5.6,4,-.9,house);mesh(new THREE.BoxGeometry(1.8,.3,.4),M("#e07a5f"),5.6,4.3,-.5,house);
// bathroom on upper floor: shower head + tap that drips/flows
const showerPipe=mesh(new THREE.CylinderGeometry(.05,.05,2.6,8),M("#b0b7bf",{metalness:.6,roughness:.3}),2.3,5.0,-1.3,house);
const showerHead=mesh(new THREE.CylinderGeometry(.25,.12,.12,14),M("#b0b7bf",{metalness:.6,roughness:.3}),2.6,6.2,-1.2,house);mesh(new THREE.BoxGeometry(.4,.05,.05),M("#b0b7bf"),2.45,6.25,-1.25,house);
mesh(new THREE.BoxGeometry(1.4,.12,1.4),M("#dfe8ee"),2.65,3.8,-.8,house);
const showerDrops=[];for(let i=0;i<60;i++){showerDrops.push(mesh(new THREE.SphereGeometry(.05,6,4),M("#4aa3df",{emissive:"#1a5d8f"}),2.6,6,-1.2,house));}
// windows on right wall
mesh(new THREE.BoxGeometry(.05,1,1.2),M("#a8d4f0",{roughness:.1}),7.24,1.8,0,house);mesh(new THREE.BoxGeometry(.05,1,1.2),M("#a8d4f0",{roughness:.1}),7.24,5.4,0,house);

/* ---------- water tank on the roof ---------- */
const tank=new THREE.Group();tank.position.set(2.7,7.4,0);scene.add(tank);
const TH=1.5,TR=.95;
mesh(new THREE.CylinderGeometry(TR,TR*.92,TH,28,1,true),M("#3c7fc4",{transparent:true,opacity:.28,side:THREE.DoubleSide,depthWrite:false}),0,TH/2,0,tank).castShadow=false;
mesh(new THREE.CylinderGeometry(TR*.92,TR*.92,.05,28),M("#2d5f94"),0,.02,0,tank);
const lid=mesh(new THREE.CylinderGeometry(TR*1.04,TR*1.04,.1,28),M("#2d5f94"),0,TH+.05,0,tank);
const tankWater=mesh(new THREE.CylinderGeometry(TR*.9,TR*.88,1,28),M("#2f8fe0",{transparent:true,opacity:.85,emissive:"#0b3d6b"}),0,.5,0,tank);
const floatArmPivot=new THREE.Group();floatArmPivot.position.set(-TR*.75,TH-.25,0);tank.add(floatArmPivot);
mesh(new THREE.BoxGeometry(.9,.04,.04),M("#888"),.45,0,0,floatArmPivot);
const floatBall=mesh(new THREE.SphereGeometry(.18,16,12),M("#ff8c1a",{emissive:"#4a2200"}),.9,0,0,floatArmPivot);
const valveLed=mesh(new THREE.SphereGeometry(.08,10,8),M("#22c55e",{emissive:"#22c55e"}),-TR*.75,TH-.05,.2,tank);

/* ---------- pipe path ---------- */
const P=(x,y,z=1.95)=>new THREE.Vector3(x,y,z);
const segs=[[P(-9,-1.1),P(-2.6,-1.1)],[P(-2.6,-1.1),P(-2.6,.5)],[P(-2.6,.5),P(1.25,.5)],[P(1.25,.5),P(1.25,9.3)],[P(1.25,9.3),P(1.25,9.3,0)],[P(1.25,9.3,0),P(2.4,9.3,0)],[P(2.4,9.3,0),P(2.4,8.75,0)]];
const path=new THREE.CurvePath();segs.forEach(([a,b])=>path.add(new THREE.LineCurve3(a,b)));
const L=path.getLength();
const lens=[];{let acc=0;segs.forEach(([a,b])=>{lens.push(acc);acc+=a.distanceTo(b);});}
const PUMP_X=-.7, PUMP_S=lens[2]+(PUMP_X-(-2.6));
const pipeM=M("#9fb8c8",{transparent:true,opacity:.33,roughness:.15,depthWrite:false});
segs.forEach(([a,b])=>{const len=a.distanceTo(b);const c=mesh(new THREE.CylinderGeometry(.17,.17,len,16,1,true),pipeM,0,0,0);c.castShadow=false;
  c.position.copy(a).add(b).multiplyScalar(.5);c.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),b.clone().sub(a).normalize());});
[P(-2.6,-1.1),P(-2.6,.5),P(1.25,.5),P(1.25,9.3),P(1.25,9.3,0),P(2.4,9.3,0)].forEach(p=>mesh(new THREE.SphereGeometry(.2,14,10),M("#8ea4b3",{roughness:.3}),p.x,p.y,p.z));
// main-street pipe is bigger + label plate
const mainPipe=mesh(new THREE.CylinderGeometry(.32,.32,9,18,1,true),M("#2f6db5",{transparent:true,opacity:.35,depthWrite:false}),-6.5,-1.1,1.95);mainPipe.rotation.z=Math.PI/2;mainPipe.castShadow=false;
// street gauge
const gauge=new THREE.Group();gauge.position.set(-5.2,.75,1.95);scene.add(gauge);
mesh(new THREE.CylinderGeometry(.06,.06,1.9,8),M("#8ea4b3"),0,-.95,0,gauge);
mesh(new THREE.CylinderGeometry(.42,.42,.12,28),M("#2b2f36"),0,.2,0,gauge).rotation.x=Math.PI/2;
const dialTex=(()=>{const c=document.createElement("canvas");c.width=c.height=256;const x=c.getContext("2d");x.fillStyle="#fff";x.beginPath();x.arc(128,128,124,0,7);x.fill();
  const arc=(a0,a1,col)=>{x.strokeStyle=col;x.lineWidth=22;x.beginPath();x.arc(128,128,96,a0,a1);x.stroke();};
  arc(Math.PI*.75,Math.PI*1.25,"#ef4444");arc(Math.PI*1.25,Math.PI*1.75,"#f59e0b");arc(Math.PI*1.75,Math.PI*2.25,"#22c55e");
  x.fillStyle="#111";x.font="bold 30px Inter";x.textAlign="center";x.fillText("bar",128,190);return new THREE.CanvasTexture(c);})();
const dial=mesh(new THREE.CircleGeometry(.38,32),new THREE.MeshBasicMaterial({map:dialTex}),0,.2,.07,gauge);
const needle=new THREE.Group();needle.position.set(0,.2,.09);gauge.add(needle);
mesh(new THREE.BoxGeometry(.04,.32,.02),M("#111"),0,.14,0,needle);

/* ---------- water particles ---------- */
const N=260;
const dropGeo=new THREE.SphereGeometry(.11,8,6);
const waterM=M("#1f8ff0",{emissive:"#0b4f8f",roughness:.2});
const drops=new THREE.InstancedMesh(dropGeo,waterM,N);drops.castShadow=false;scene.add(drops);
const dummy=new THREE.Object3D();

/* ---------- pump with sensors ---------- */
const pump=new THREE.Group();pump.position.set(PUMP_X,.5,1.95);scene.add(pump);
const pumpBody=new THREE.Group();pump.add(pumpBody);
const teal=M("#13a89e",{roughness:.45}),dark=M("#1f2933",{roughness:.6});
mesh(new THREE.BoxGeometry(1.5,.12,.9),dark,0,-.46,0,pumpBody);
const motor=mesh(new THREE.CylinderGeometry(.42,.42,.95,24),teal,.25,0,0,pumpBody);motor.rotation.z=Math.PI/2;
for(let i=0;i<8;i++){const f=mesh(new THREE.BoxGeometry(.9,.04,.06),teal,.3,0,0,pumpBody);f.position.y=Math.sin(i/8*Math.PI*2)*.44;f.position.z=Math.cos(i/8*Math.PI*2)*.44;}
const head=mesh(new THREE.CylinderGeometry(.5,.5,.38,24),teal,-.42,0,0,pumpBody);head.rotation.z=Math.PI/2;
const fan=new THREE.Group();fan.position.set(-.62,0,0);pumpBody.add(fan);
mesh(new THREE.CylinderGeometry(.08,.08,.06,10),M("#ddd"),0,0,0,fan).rotation.z=Math.PI/2;
for(let i=0;i<6;i++){const b=mesh(new THREE.BoxGeometry(.03,.36,.08),M("#e5e7eb",{metalness:.5,roughness:.3}),-.02,0,0,fan);b.rotation.x=i/6*Math.PI*2;b.position.y=Math.cos(i/6*Math.PI*2)*.18;b.position.z=Math.sin(i/6*Math.PI*2)*.18;}
const fanCover=mesh(new THREE.CylinderGeometry(.5,.5,.03,24),M("#bfe9ff",{transparent:true,opacity:.25,depthWrite:false}),-.63,0,0,pumpBody);fanCover.rotation.z=Math.PI/2;
const pumpLed=mesh(new THREE.SphereGeometry(.06,10,8),M("#444"),.6,.3,.45,pumpBody);
// pressostato (gauge) & fluxostato (sensor box)
const pressostato=new THREE.Group();pump.add(pressostato);
mesh(new THREE.CylinderGeometry(.05,.05,.35,8),M("#b0b7bf",{metalness:.6}),0,0,0,pressostato);
const pDial=mesh(new THREE.CylinderGeometry(.2,.2,.1,24),M("#e11d48"),0,.25,0,pressostato);pDial.rotation.x=Math.PI/2;
mesh(new THREE.CircleGeometry(.16,24),new THREE.MeshBasicMaterial({map:dialTex}),0,.25,.06,pressostato);
const fluxostato=new THREE.Group();pump.add(fluxostato);
mesh(new THREE.BoxGeometry(.38,.3,.32),M("#f59e0b"),0,0,0,fluxostato);
const fluxLed=mesh(new THREE.SphereGeometry(.05,10,8),M("#22c55e",{emissive:"#22c55e"}),.1,.06,.17,fluxostato);
// built-in badge (control panel) on the pump
const panel=mesh(new THREE.BoxGeometry(.5,.32,.06),M("#111827"),.25,.15,.47,pumpBody);
const panelLed=mesh(new THREE.BoxGeometry(.3,.1,.02),M("#22c55e",{emissive:"#22c55e"}),.25,.17,.51,pumpBody);
// automatic controller (solution 2) on the outlet pipe
const ctrl=new THREE.Group();ctrl.position.set(.55,1.05,1.95);scene.add(ctrl);
mesh(new THREE.BoxGeometry(.55,.62,.36),M("#1f2937"),0,0,0,ctrl);
mesh(new THREE.BoxGeometry(.4,.2,.02),M("#0ea5e9",{emissive:"#075985"}),0,.12,.19,ctrl);
const ctrlLed=mesh(new THREE.SphereGeometry(.05,10,8),M("#22c55e",{emissive:"#22c55e"}),-.15,-.16,.19,ctrl);
const ctrlLed2=mesh(new THREE.SphereGeometry(.05,10,8),M("#ef4444",{emissive:"#ef4444"}),.15,-.16,.19,ctrl);
mesh(new THREE.CylinderGeometry(.08,.08,.5,8),M("#8ea4b3"),0,-.5,0,ctrl);
// scanning ring for "interpreting flow"
const ring=mesh(new THREE.TorusGeometry(.38,.03,8,40),new THREE.MeshBasicMaterial({color:"#38bdf8",transparent:true}),-1.3,.5,1.95);ring.rotation.y=Math.PI/2;ring.castShadow=false;

/* ---------- ordinary peripheral pump (burns when dry) ---------- */
const bad=new THREE.Group();bad.position.set(-4.0,.47,.9);bad.rotation.y=.25;scene.add(bad);
const badM=M("#6b7280",{roughness:.5,emissive:"#000"});
mesh(new THREE.BoxGeometry(1.2,.1,.7),dark,0,-.36,0,bad);
const bm=mesh(new THREE.CylinderGeometry(.33,.33,.8,20),badM,.15,0,0,bad);bm.rotation.z=Math.PI/2;
const bh=mesh(new THREE.CylinderGeometry(.4,.4,.3,20),badM,-.4,0,0,bad);bh.rotation.z=Math.PI/2;
const smoke=[];for(let i=0;i<34;i++)smoke.push(mesh(new THREE.SphereGeometry(.18,8,6),M("#555",{transparent:true,opacity:.6,depthWrite:false}),0,0,0,bad));
const sparks=[];for(let i=0;i<16;i++)sparks.push(mesh(new THREE.SphereGeometry(.035,6,4),new THREE.MeshBasicMaterial({color:"#ffd34d"}),0,0,0,bad));


/* ---------- characters ---------- */
function person({skin="#e0ac69",shirt="#3a86ff",pants="#264653",hair="#2b1b10",towel=false,cap=null,s=1}){
  const root=new THREE.Group(),body=new THREE.Group();root.add(body);
  const Sk=M(skin),Sh=M(towel?skin:shirt),Pa=M(towel?"#7dd3fc":pants),Ha=M(hair);
  const leg=x=>{const g=new THREE.Group();g.position.set(x,.9,0);mesh(new THREE.BoxGeometry(.26,.9,.28),towel?Sk:Pa,0,-.45,0,g);mesh(new THREE.BoxGeometry(.28,.12,.38),M("#333"),0,-.86,.05,g);body.add(g);return g;};
  const legL=leg(-.16),legR=leg(.16);
  mesh(new THREE.BoxGeometry(.72,.9,.42),Sh,0,1.35,0,body);
  if(towel)mesh(new THREE.BoxGeometry(.78,.5,.48),Pa,0,.85,0,body);
  const head=new THREE.Group();head.position.y=1.82;body.add(head);
  mesh(new THREE.SphereGeometry(.32,16,12),Sk,0,.28,0,head);
  if(cap){mesh(new THREE.SphereGeometry(.34,16,10,0,Math.PI*2,0,Math.PI/2),M(cap),0,.33,0,head);mesh(new THREE.BoxGeometry(.4,.04,.3),M(cap),0,.36,.3,head);}
  else mesh(new THREE.SphereGeometry(.335,16,10,0,Math.PI*2,0,Math.PI/2.2),Ha,0,.32,-.02,head);
  const eyeM=M("#111");mesh(new THREE.SphereGeometry(.045,8,6),eyeM,-.11,.33,.29,head);mesh(new THREE.SphereGeometry(.045,8,6),eyeM,.11,.33,.29,head);
  const mouth=mesh(new THREE.TorusGeometry(.085,.02,6,12,Math.PI),M("#7a2a2a"),0,.18,.3,head);
  const arm=x=>{const g=new THREE.Group();g.position.set(x,1.72,0);mesh(new THREE.BoxGeometry(.2,.75,.22),Sh,0,-.36,0,g);mesh(new THREE.SphereGeometry(.11,8,6),Sk,0,-.78,0,g);body.add(g);return g;};
  const armL=arm(-.47),armR=arm(.47);root.scale.setScalar(s);scene.add(root);
  return {root,body,head,mouth,legL,legR,armL,armR};
}
function pose(p,{la=[0,0],ra=[0,0],ll=0,lr=0,ht=0,hy=0,smile=true}){p.armL.rotation.set(la[0],0,la[1]);p.armR.rotation.set(ra[0],0,ra[1]);p.legL.rotation.x=ll;p.legR.rotation.x=lr;p.head.rotation.set(ht,hy,0);p.mouth.rotation.z=smile?Math.PI:0;p.mouth.position.y=smile?.2:.14;}
const morador=person({skin:"#d9a066",hair:"#2b1b10",towel:true,s:.82});morador.root.position.set(2.65,3.72,-1.0);
const tecnico=person({skin:"#a86b3c",shirt:"#f59e0b",pants:"#1e3a5f",cap:"#1e3a5f",s:.85});
const vizinho=person({skin:"#f1c27d",shirt:"#8b5cf6",pants:"#374151",hair:"#6b4423",s:.85});vizinho.root.position.set(-5.1,.12,.7);vizinho.root.rotation.y=.5;
/* ---------- 3D labels ---------- */
function rr(x,X,Y,w,h,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath();}
function label(text,{bg="#ffffff",fg="#0f172a",icon=""}={}){
  const c=document.createElement("canvas"),x=c.getContext("2d");x.font="800 46px Inter";
  const tw=x.measureText(text).width+(icon?64:0);c.width=Math.ceil(tw+56);c.height=88;
  x.font="800 46px Inter";x.fillStyle="rgba(0,0,0,.25)";rr(x,4,8,c.width-8,c.height-12,24);x.fill();
  x.fillStyle=bg;rr(x,2,2,c.width-8,c.height-12,24);x.fill();
  let X=26;if(icon){x.fillStyle=fg;x.beginPath();x.arc(X+22,40,24,0,7);x.fill();x.fillStyle=bg;x.font="900 34px Inter";x.textAlign="center";x.fillText(icon,X+22,52);x.textAlign="left";X+=64;}
  x.font="800 46px Inter";x.fillStyle=fg;x.fillText(text,X,58);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthTest:false}));
  s.renderOrder=10;s.userData.aspect=c.width/c.height;scene.add(s);return s;
}

[11.2,14.3,"nesse caso, poderíamos aplicar uma bomba com"],[14.4,18,"pressostato e fluxostato interno, alta aspirante"],[18,19.4,"alguns modelos já vêm com esse"],[19.4,22.2,"pressostato e fluxostato embutido na própria bomba"],
[22.3,23.4,"ou podemos utilizar uma bomba"],[23.4,26.2,"alta aspirante com o controlador automático de bombas"],[26.4,28.4,"nesse caso, ele vai interpretar se tá tendo"],[28.4,29.4,"fluxo na rede"],[29.4,31.8,"se o fluxo da rede tá chegando até a bomba"],
[32.4,34.4,"e, caso"],[34.4,35.4,"seja chegando"],[35.4,36,"fluxo até a bomba"],[36,38.2,"vai mandar esse fluxo até sua caixa d'água"],[38.3,40.6,"quando a sua boia da caixa d'água fechar"],
[40.8,44,"encerrar, ela vai interpretar que o fluxo cortou"],[44,45.3,"e vai finalizar"],[45.3,47.2,"o bombeamento da rede"],[47.3,50.2,"dessa forma, vai evitar que a bomba trabalhe a seco"],[50.3,51.8,"e possa vir"],[51.8,54.8,"a queimar, como se fosse uma bomba periférica normal"]];
const SECTIONS=[[0,11.3,"O problema","A água não chega no chuveiro"],[11.3,22.3,"Solução 1","Bomba com pressostato e fluxostato"],[22.3,26.4,"Solução 2","Bomba + controlador automático"],[26.4,47.3,"Como funciona","O sensor lê o fluxo da rede"],[47.3,60,"Falta d'água na rua","A bomba protegida não queima"]];
// camera shots: [time, pos, target]
const SHOTS=[
 [0,[3.0,5.4,7.6],[2.9,4.9,-.6]],
 [4.0,[3.0,5.4,7.8],[2.9,4.9,-.6]],
 [6.6,[.2,4.0,25],[.2,3.7,0]],
 [8.6,[.2,4.0,24],[.2,3.7,0]],
 [10.6,[-1.6,1.6,9.6],[-1.4,.75,1.9]],
 [13.0,[PUMP_X-.4,1.5,9.2],[PUMP_X-.4,.75,1.9]],
 [22.2,[PUMP_X+.3,1.5,9.2],[PUMP_X+.4,.75,1.9]],
 [26.3,[-1.6,1.9,13],[-1.6,.4,1.9]],
 [31.6,[-1.6,1.9,13],[-1.6,.4,1.9]],
 [33.4,[.6,4.0,19],[.9,3.3,1]],
 [35.4,[.6,4.0,19],[.9,4.3,1]],
 [36.6,[3.0,5.4,7.8],[2.9,4.9,-.6]],
 [38.0,[3.0,5.4,7.8],[2.9,4.9,-.6]],
 [39.2,[2.4,9.0,6.6],[2.4,8.2,0]],
 [40.6,[2.4,9.0,6.6],[2.4,8.2,0]],
 [42.0,[-.2,1.7,9.5],[-.1,.75,1.9]],
 [46.4,[-.2,1.7,9.5],[-.1,.75,1.9]],
 [48.0,[-2.0,2.2,14],[-2.0,.1,1.9]],
 [51.2,[-2.0,2.2,14],[-2.0,.1,1.9]],
 [52.6,[-2.7,2.6,13],[-2.7,.8,1.5]],
 [60,[-2.7,2.7,12.6],[-2.7,.8,1.5]]];
function camAt(t){let i=0;while(i<SHOTS.length-2&&t>SHOTS[i+1][0])i++;const a=SHOTS[i],b=SHOTS[i+1];const k=sm((t-a[0])/(b[0]-a[0]));
  const lp=(u,v)=>u.map((x,j)=>x+(v[j]-x)*k);return [lp(a[1],b[1]),lp(a[2],b[2])];}

// precomputed integrals (flow phase, impeller angle)
const DT=1/120,TMAX=60;const flowPhase=[0],fanAng=[0];
function flowSpeed(t){ if(t>=40.6)return 0; const weak=1.3, strong=5.2; return weak+(strong-weak)*ramp(t,32.6,34.2); }
function pumpOn(t){return ramp(t,32.6,33.4)*(1-ramp(t,44.2,45.2));}
for(let i=1;i<=TMAX/DT;i++){const t=i*DT;flowPhase.push(flowPhase[i-1]+flowSpeed(t)*DT);fanAng.push(fanAng[i-1]+pumpOn(t)*28*DT);}
const look=(arr,t)=>arr[Math.min(arr.length-1,Math.round(t/DT))];

function reach(t){ // how far along the pipe water gets (in path length)
  const weak=lens[3]+1.4+.5*Math.sin(t*1.7);
  const full=L;
  return weak+(full-weak)*ramp(t,32.8,36.4);
}
function tankLevel(t){return .12+.8*ramp(t,36.2,40.4);}
function mainWater(t){return 1-ramp(t,47.4,49.2);}

function drawFrame(t){
  // camera
  const [cp,ct]=camAt(t);camera.position.set(...cp);camera.lookAt(...ct);
  // water
  const ph=look(flowPhase,t), R=reach(t), mw=mainWater(t);
  for(let i=0;i<N;i++){
    let s=((i/N)*L+ph)%L; const vis=s<=R && mw>0;
    let sc=vis?1:0; if(vis&&R-s<1.2&&t<36.4)sc*=clamp((R-s)/1.2,.25,1);
    if(mw<1){const lim=L*(1-mw)*1.1; if(s<lim)sc=0;} // pipe drains from the street side
    const p=path.getPointAt(clamp(s/L,0,1));
    dummy.position.copy(p);dummy.scale.setScalar(sc*(.85+.3*((i*7)%5)/5));dummy.updateMatrix();drops.setMatrixAt(i,dummy.matrix);
  }
  drops.instanceMatrix.needsUpdate=true;
  // gauge needle: low pressure, drops to zero when dry
  const pr=(.22+.04*Math.sin(t*3))*mw;
  needle.rotation.z=Math.PI*.75-pr*Math.PI*1.5;
  // tank
  const lv=tankLevel(t);tankWater.scale.y=lv*TH*.95;tankWater.position.y=lv*TH*.95/2+.04;
  floatArmPivot.rotation.z=-.55+ .62*ramp(t,37.5,40.4);
  const closed=t>40.4; valveLed.material.color.set(closed?"#ef4444":"#22c55e");valveLed.material.emissive.set(closed?"#ef4444":"#22c55e");
  // shower in the house: weak dribble before, good flow while pump runs
  const fl=t<36.4?.12:1;
  showerDrops.forEach((d,i)=>{const u=((t*1.6+i/showerDrops.length)%1);d.visible=fl>0&&(i/showerDrops.length)<fl+.05;
    d.position.set(2.6+Math.sin(i*2.4)*.3*u*fl,6.1-u*2.2,-.95+Math.cos(i*1.7)*.3*u*fl);});
  // pump appearance
  const pIn=ramp(t,11.5,12.4); pump.scale.setScalar(.001+pIn); pump.position.y=.5+(1-pIn)*.6;
  const run=pumpOn(t); pumpBody.position.set(Math.sin(t*90)*.012*run,Math.cos(t*77)*.01*run,0);
  fan.rotation.x=look(fanAng,t);
  const ledCol=run>.5?"#22c55e":(t>44.2?"#ef4444":"#555");pumpLed.material.color.set(ledCol);pumpLed.material.emissive.set(run>.5?"#22c55e":(t>44.2?"#7f1d1d":"#000"));
  // sensors: pop in 14.5, sink into the body at 19.5, hide when switching to solution 2
  const sIn=ramp(t,14.5,15.3), emb=ramp(t,19.6,20.8), sol2=ramp(t,22.4,23.2);
  pressostato.position.set(-.45+.55*emb,.62+.35*(1-sIn)-.5*emb,.2*emb); pressostato.scale.setScalar(Math.max(.001,sIn*(1-emb*.9)*(1-sol2)));
  fluxostato.position.set(.7-.35*emb,.25-.1*emb,.35-.3*emb); fluxostato.scale.setScalar(Math.max(.001,sIn*(1-emb*.9)*(1-sol2)));
  const panelVis=Math.max(.001,emb*(1-sol2));panel.scale.setScalar(panelVis);panelLed.scale.setScalar(panelVis);
  fluxLed.material.emissive.set(Math.sin(t*8)>0?"#22c55e":"#064e3b");
  // controller
  const cIn=ramp(t,23.5,24.3); ctrl.scale.setScalar(Math.max(.001,cIn)); ctrl.position.y=1.05+(1-cIn)*.8;
  const flowOk=t>29.6&&t<41.2, cut=t>=41.2;
  ctrlLed.material.emissive.set(flowOk||(t<29.6&&Math.sin(t*10)>0)?"#22c55e":"#052e16");
  ctrlLed2.material.emissive.set(cut&&Math.sin(t*9)>-0.2?"#ef4444":"#450a0a");
  // scanning ring
  const scan=win(t,26.6,32.4,.4)+win(t,41.2,44.2,.3)*1+win(t,47.6,51.4,.4);
  ring.visible=scan>0.01; const ru=(t*1.2)%1; ring.scale.setScalar(.8+ru*.8); ring.material.opacity=scan*(1-ru);
  ring.material.color.set(t>41.2?(t>47.6?"#22c55e":"#ef4444"):(t>29.6?"#22c55e":"#38bdf8"));
  // bad pump
  const bIn=ramp(t,51.9,52.6); bad.scale.setScalar(Math.max(.001,bIn));
  const heat=ramp(t,52.4,54.6); badM.color.setRGB(.42+.5*heat,.45-.25*heat,.5-.35*heat); badM.emissive.setRGB(.5*heat,.08*heat,0);
  bad.position.x=-4.0+Math.sin(t*95)*.015*bIn;
  smoke.forEach((m,i)=>{const age=((t-52.3)-i*.07); if(age<0||bIn<.5){m.visible=false;return;} const u=(age%2.2)/2.2;m.visible=true;
    m.position.set(-.3+Math.sin(i*3.1)*.25*u,.3+u*2.6,Math.cos(i*2.3)*.25*u);m.scale.setScalar(.6+u*2.2);m.material.opacity=.55*(1-u)*heat;});
  sparks.forEach((m,i)=>{const u=((t*2.3+i/sparks.length)%1);m.visible=heat>.3;m.position.set(-.45+Math.sin(i*5)*u*.9,.2+u*.9-u*u*1.2,Math.cos(i*3)*u*.9);});
  // characters
  { const sad=t<36.4, happy=t>=36.4&&t<41;
    if(sad){const shake=win(t,4.4,8.4,.4)*Math.sin(t*7)*.35;pose(morador,{la:[-.5,.5],ra:[-.5,-.5],ht:.35,hy:shake,smile:false});morador.root.position.y=3.72;}
    else{const h=happy?Math.abs(Math.sin(t*6.5))*.28:0;morador.root.position.y=3.72+h;const w=Math.sin(t*10)*.35;pose(morador,{la:[0,2.6+w],ra:[0,-2.6-w],ht:-.15,smile:true});}
    // technician walks in, points at the pump, then at the controller, thumbs up
    const walk=ramp(t,11.4,13.2);tecnico.root.visible=t>11.3;
    tecnico.root.position.set(-4.4+2.35*walk,.13,1.25);
    const stepping=t>11.3&&t<13.2;const sw=stepping?Math.sin(t*12)*.6:0;
    tecnico.root.rotation.y=stepping?Math.PI/2:.55;
    let la=[sw,0],ra=[-sw,0];
    if(t>=14.4&&t<23.4)ra=[-1.3,-.2+Math.sin(t*3)*.08];
    if(t>=23.4&&t<26.4)ra=[-1.5,-.9];
    if(t>=32.6&&t<36)ra=[-2.9,-.2];
    if(t>=44.2&&t<47.4){la=[-1.2,.6];ra=[-1.2,-.6];}
    pose(tecnico,{la,ra,ll:sw,lr:-sw,ht:0,hy:0,smile:!(t>41.2&&t<44.2)});
    // neighbour panics when his ordinary pump burns
    vizinho.root.visible=t>51.8;const pan=Math.sin(t*14)*.25;
    pose(vizinho,{la:[-2.6,.9+pan],ra:[-2.6,-.9-pan],ht:-.1,hy:Math.sin(t*8)*.3,smile:false});vizinho.root.position.y=.12+Math.abs(Math.sin(t*9))*.08;
  }
  // labels
  LABELS.forEach(({s,a,b,sc})=>{const o=win(t,a,b,.35);s.visible=o>.01;s.material.opacity=o;const pop=1+.12*(1-ramp(t,a,a+.35));s.scale.set(sc*s.userData.aspect*pop,sc*pop,1);});
  renderer.render(scene,camera);
  composite(t);
}

/* ---------- 2D overlay: section header + captions ---------- */
function wrap(text,maxW){const ws=text.split(" "),ls=[];let l="";ws.forEach(w=>{const tl=l?l+" "+w:w;if(ctx.measureText(tl).width>maxW&&l){ls.push(l);l=w;}else l=tl;});ls.push(l);return ls;}
function composite(t){
  ctx.drawImage(renderer.domElement,0,0);
  const sec=SECTIONS.find(s=>t>=s[0]&&t<s[1]);
  if(sec){const o=win(t,sec[0],sec[1],.35);ctx.globalAlpha=o;
    ctx.font="800 26px Inter";const k=sec[2].toUpperCase();const kw=ctx.measureText(k).width;
    ctx.fillStyle="#0f172a";rr(ctx,36,58,kw+40,46,23);ctx.fill();ctx.fillStyle="#7dd3fc";ctx.fillText(k,56,90);
    ctx.font="800 40px Inter";ctx.fillStyle="#0f172a";ctx.strokeStyle="rgba(255,255,255,.9)";ctx.lineWidth=8;ctx.lineJoin="round";
    wrap(sec[3],640).forEach((l,i)=>{ctx.strokeText(l,36,152+i*48);ctx.fillText(l,36,152+i*48);});
    ctx.globalAlpha=1;}
  const cap=CAPS.find(c=>t>=c[0]&&t<c[1]);
  if(cap){ctx.font="800 40px Inter";const ls=wrap(cap[2],620);const lh=52,h=ls.length*lh+36,y0=H-150-h;
    ctx.fillStyle="rgba(10,14,24,.78)";rr(ctx,30,y0,W-60,h,22);ctx.fill();
    ctx.fillStyle="#ffffff";ctx.textAlign="center";ls.forEach((l,i)=>ctx.fillText(l,W/2,y0+52+i*lh));ctx.textAlign="left";}
}
window.renderAt=t=>{drawFrame(t);return out.toDataURL("image/jpeg",.9);};
window.ready=true;
